name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack
          POSTGRES_DB: fintrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Backend (consumed both directly and by the webServer subprocess
      # Playwright spawns for the e2e run — see e2e/playwright.config.js)
      DATABASE_URL: postgresql://fintrack:fintrack@localhost:5432/fintrack?schema=public
      JWT_SECRET: ci-only-secret-not-used-in-production
      JWT_EXPIRES_IN: 1d
      PORT: 3333
      CORS_ORIGIN: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      # No real Resend key in CI — nothing in the e2e suite sends e-mail,
      # this just needs to exist so the client can be instantiated.
      RESEND_API_KEY: re_dummy_ci_key
      EMAIL_FROM: "FinTrack <onboarding@resend.dev>"
      # Frontend
      VITE_API_URL: http://localhost:3333/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run database migrations
        run: npx prisma migrate deploy
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run E2E tests
        run: npm test
        working-directory: e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
